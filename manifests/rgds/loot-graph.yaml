apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: loot-graph
  labels:
    app.kubernetes.io/part-of: krombat
spec:
  schema:
    apiVersion: v1alpha1
    kind: Loot
    group: game.k8s.example
    spec:
      dungeonName: string | required=true
      rarity: string | default="common" enum=common,rare,epic
    status:
      description: ${lootInfo.data.description}
      itemName: ${lootSecret.metadata.name}
  resources:
    - id: lootInfo
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name + '-info'}
          namespace: ${schema.metadata.namespace}
          labels:
            game.k8s.example/dungeon: ${schema.spec.dungeonName}
            game.k8s.example/entity: loot
        data:
          description: ${'A ' + schema.spec.rarity + ' trophy (display only)'}
    - id: lootSecret
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            game.k8s.example/dungeon: ${schema.spec.dungeonName}
            game.k8s.example/entity: loot
        type: Opaque
        stringData:
          rarity: ${schema.spec.rarity}
          trophy: ${random.seededString(8, schema.metadata.name)}
