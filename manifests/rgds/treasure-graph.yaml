apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: treasure-graph
  labels:
    app.kubernetes.io/part-of: krombat
spec:
  schema:
    apiVersion: v1alpha1
    kind: Treasure
    group: game.k8s.example
    spec:
      dungeonName: string | required=true
      opened: integer | default=0 minimum=0 maximum=1
    status:
      treasureState: ${treasureState.data.state}
  resources:
    - id: treasureState
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name + '-state'}
          namespace: ${schema.metadata.namespace}
          labels:
            game.k8s.example/dungeon: ${schema.spec.dungeonName}
            game.k8s.example/entity: treasure
        data:
          state: "${schema.spec.opened == 1 ? 'opened' : 'unopened'}"
    - id: treasureSecret
      includeWhen:
        - ${schema.spec.opened == 1}
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            game.k8s.example/dungeon: ${schema.spec.dungeonName}
            game.k8s.example/entity: treasure
        type: Opaque
        stringData:
          reward: ${'Victory trophy for ' + schema.spec.dungeonName}
