apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpg-backend
  namespace: rpg-system
  labels:
    app.kubernetes.io/part-of: krombat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rpg-backend
  template:
    metadata:
      labels:
        app: rpg-backend
    spec:
      serviceAccountName: rpg-backend-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: krombat-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: krombat-session
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: rpg-backend
  namespace: rpg-system
spec:
  selector:
    app: rpg-backend
  ports:
    - port: 8080
      targetPort: 8080
