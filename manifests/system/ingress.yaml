apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krombat
  namespace: rpg-system
  labels:
    app.kubernetes.io/part-of: krombat
spec:
  ingressClassName: nginx
  rules:
    - host: krombat.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rpg-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rpg-frontend
                port:
                  number: 3000
