apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpg-frontend
  namespace: rpg-system
  labels:
    app.kubernetes.io/part-of: krombat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rpg-frontend
  template:
    metadata:
      labels:
        app: rpg-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: krombat-frontend:local
          ports:
            - containerPort: 3000
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 500m
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rpg-frontend
  namespace: rpg-system
spec:
  selector:
    app: rpg-frontend
  ports:
    - port: 3000
      targetPort: 3000
