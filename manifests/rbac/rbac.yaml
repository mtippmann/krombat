apiVersion: v1
kind: ServiceAccount
metadata:
  name: rpg-backend-sa
  namespace: rpg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rpg-backend
  namespace: rpg-demo
rules:
  - apiGroups: [game.k8s.example]
    resources: [dungeons]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [game.k8s.example]
    resources: [heroes, monsters, bosses, treasures, loots]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps, secrets, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rpg-backend
  namespace: rpg-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rpg-backend
subjects:
  - kind: ServiceAccount
    name: rpg-backend-sa
    namespace: rpg-system
