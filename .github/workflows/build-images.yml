name: Container checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --target test -t krombat-backend-tests backend
      - run: docker build -t krombat-backend:local backend
      - run: docker build -t krombat-frontend:local frontend
      - run: bash tests/guardrails.sh
